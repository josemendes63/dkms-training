site_name: DKMS Training Portal
site_description: Formação e documentação técnica
site_author: José Mendes

theme:
  name: material
  language: pt

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest

  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Modo escuro

    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Modo claro

  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md

  - Docker:
      - Visão Geral: docker/index.md
      - Containers: docker/containers.md
      - Images: docker/images.md
      - Compose: docker/compose.md
      - Registries: docker/registries.md

  - Kubernetes:
      - Visão Geral: kubernetes/index.md
      - Pods: kubernetes/pods.md
      - Namespaces: kubernetes/namespaces.md
      - Deployments: kubernetes/deployments.md
      - Services: kubernetes/services.md
      - Volumes: kubernetes/volumes.md
      - ConfigMaps: kubernetes/configmaps.md
      - Secrets: kubernetes/secrets.md
      - Ingress: kubernetes/ingress.md
    
  - Linux:
      - Visão Geral: linux/index.md
      - Comandos: linux/commands.md
      - Shell Scripts: linux/scripts.md

  - Exasol:
      - Visão Geral: exasol/index.md
      - Administração: exasol/administration.md
      - BucketFS: exasol/bucketfs.md
      - Backup e Restore: exasol/backup.md
      - DBeaver: exasol/dbeaver.md

  - GitHub:
      - Visão Geral: github/index.md
      - Git Básico: github/git-basics.md
      - GitHub Pages: github/github-pages.md
      - MkDocs: github/mkdocs.md